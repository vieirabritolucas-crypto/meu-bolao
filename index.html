<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bolão</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial; background: #667eea; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; }
        button { background: #27ae60; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meu Bolão</h1>
        <div id="login">
            <input type="text" id="nome" placeholder="Seu nome">
            <input type="text" id="celular" placeholder="WhatsApp">
            <button onclick="fazerLogin()">Entrar</button>
            <div id="status">Pronto para login</div>
        </div>
        <div id="painel" style="display:none">
            <button onclick="logout()">Sair</button>
            <h2 id="userNome"></h2>
            <div id="conteudo">Carregando...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNtc50Dxym-ZL9QW7q9V9yLrYezijq0ek",
            authDomain: "meu-bolao-7977f.firebaseapp.com",
            databaseURL: "https://meu-bolao-7977f-default-rtdb.firebaseio.com",
            projectId: "meu-bolao-7977f",
            storageBucket: "meu-bolao-7977f.firebasestorage.app",
            messagingSenderId: "766522730401",
            appId: "1:766522730401:web:c056a8dedc130e6a5b0de0"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let usuarioAtual = null;
        
        function fazerLogin() {
            const nome = document.getElementById('nome').value.trim();
            const celular = document.getElementById('celular').value.trim();
            if (!nome || !celular) { alert('Preencha os campos'); return; }
            
            db.ref('participantes').once('value').then(snap => {
                let participantes = snap.val() ? Object.values(snap.val()) : [];
                let participante = participantes.find(p => p.celular === celular);
                
                if (!participante) {
                    participante = { nome, celular, palpites: [], pagamentos: [] };
                    db.ref('participantes').push(participante);
                }
                
                usuarioAtual = participante;
                localStorage.setItem('userCelular', celular);
                document.getElementById('login').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
                document.getElementById('userNome').innerHTML = `Bem-vindo, ${nome}!`;
                
                carregarJogos();
            });
        }
        
        function logout() {
            localStorage.removeItem('userCelular');
            usuarioAtual = null;
            document.getElementById('login').style.display = 'block';
            document.getElementById('painel').style.display = 'none';
        }
        
        function carregarJogos() {
            db.ref('jogos').once('value').then(snap => {
                const jogos = snap.val() ? Object.values(snap.val()) : [];
                let html = '<h3>Jogos</h3>';
                jogos.forEach(j => {
                    html += `<p><strong>${j.time1} x ${j.time2}</strong> - ${j.data || '--/--'}</p>`;
                });
                document.getElementById('conteudo').innerHTML = html;
            });
        }
        
        // Verificar sessão
        const celularSalvo = localStorage.getItem('userCelular');
        if (celularSalvo) {
            db.ref('participantes').once('value').then(snap => {
                let participantes = snap.val() ? Object.values(snap.val()) : [];
                let participante = participantes.find(p => p.celular === celularSalvo);
                if (participante) {
                    usuarioAtual = participante;
                    document.getElementById('login').style.display = 'none';
                    document.getElementById('painel').style.display = 'block';
                    document.getElementById('userNome').innerHTML = `Bem-vindo, ${participante.nome}!`;
                    carregarJogos();
                }
            });
        }
    </script>
</body>
</html>
