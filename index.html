<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Meu Bolão</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 30px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 30px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .aviso { background: #f39c12; color: white; padding: 10px; border-radius: 10px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Meu Bolão</h1>
        
        <div id="loginDiv">
            <input type="text" id="nome" placeholder="Seu nome">
            <input type="text" id="celular" placeholder="WhatsApp">
            <button id="btnLogin">Entrar</button>
            <div id="status" class="aviso">Carregando...</div>
        </div>
        
        <div id="painelDiv" style="display:none">
            <button id="btnSair">Sair</button>
            <h2 id="userNome"></h2>
            <div id="conteudo">Carregando jogos...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNtc50Dxym-ZL9QW7q9V9yLrYezijq0ek",
            authDomain: "meu-bolao-7977f.firebaseapp.com",
            databaseURL: "https://meu-bolao-7977f-default-rtdb.firebaseio.com",
            projectId: "meu-bolao-7977f",
            storageBucket: "meu-bolao-7977f.firebasestorage.app",
            messagingSenderId: "766522730401",
            appId: "1:766522730401:web:c056a8dedc130e6a5b0de0"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let usuarioAtual = null;
        let todosJogos = [];
        
        document.getElementById('status').innerHTML = 'Pronto!';
        
        async function fazerLogin() {
            const nome = document.getElementById('nome').value.trim();
            const celular = document.getElementById('celular').value.trim();
            if (!nome || !celular) {
                alert('Preencha nome e celular!');
                return;
            }
            
            document.getElementById('status').innerHTML = 'Verificando...';
            
            try {
                const snap = await db.ref('participantes').once('value');
                const participantes = snap.val() ? Object.values(snap.val()) : [];
                let participante = participantes.find(p => p.celular === celular);
                
                if (!participante) {
                    participante = { nome, celular, palpites: [], pagamentos: [] };
                    await db.ref('participantes').push(participante);
                }
                
                usuarioAtual = participante;
                localStorage.setItem('userCelular', celular);
                document.getElementById('loginDiv').style.display = 'none';
                document.getElementById('painelDiv').style.display = 'block';
                document.getElementById('userNome').innerHTML = `Bem-vindo, ${nome}!`;
                
                await carregarJogos();
            } catch(e) {
                document.getElementById('status').innerHTML = 'Erro: ' + e.message;
            }
        }
        
        function logout() {
            localStorage.removeItem('userCelular');
            usuarioAtual = null;
            document.getElementById('loginDiv').style.display = 'block';
            document.getElementById('painelDiv').style.display = 'none';
        }
        
        async function carregarJogos() {
            const snap = await db.ref('jogos').once('value');
            todosJogos = snap.val() ? Object.values(snap.val()) : [];
            
            let html = '<h3>Jogos da Rodada</h3>';
            if (todosJogos.length === 0) {
                html += '<p>Nenhum jogo cadastrado</p>';
            } else {
                todosJogos.forEach(jogo => {
                    html += `<p><strong>${jogo.time1} x ${jogo.time2}</strong> - ${jogo.data || '--/--'}</p>`;
                });
            }
            document.getElementById('conteudo').innerHTML = html;
        }
        
        // Eventos
        document.getElementById('btnLogin').onclick = fazerLogin;
        document.getElementById('btnSair').onclick = logout;
        
        // Verificar sessão salva
        const celularSalvo = localStorage.getItem('userCelular');
        if (celularSalvo) {
            db.ref('participantes').once('value').then(snap => {
                const participantes = snap.val() ? Object.values(snap.val()) : [];
                const participante = participantes.find(p => p.celular === celularSalvo);
                if (participante) {
                    usuarioAtual = participante;
                    document.getElementById('loginDiv').style.display = 'none';
                    document.getElementById('painelDiv').style.display = 'block';
                    document.getElementById('userNome').innerHTML = `Bem-vindo, ${participante.nome}!`;
                    carregarJogos();
                }
            });
        }
    </script>
</body>
</html>
